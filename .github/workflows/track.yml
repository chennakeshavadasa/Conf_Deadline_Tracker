name: Track conferences

on:
  schedule:
    - cron: "17 2 * * *"      # daily at 02:17 UTC (07:47 IST)
  workflow_dispatch:
    inputs:
      all:
        description: "Check every upcoming edition now (ignores the schedule)"
        type: boolean
        default: false
      series:
        description: "Only check this series id (e.g. iscas). Leave empty for normal run."
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          MAX_CHECKS: ${{ vars.MAX_CHECKS || '25' }}
          ALLOW_WEB_SEARCH: ${{ vars.ALLOW_WEB_SEARCH || '1' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          ARGS=""
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="--all"; fi
          if [ -n "${{ inputs.series }}" ]; then ARGS="--series ${{ inputs.series }}"; fi
          python tracker/track.py $ARGS

      - name: Commit updated data
        run: |
          git config user.name "conference-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Tracker update $(date -u +%F)"
            git push
          fi

      - name: Open or update review issue
        if: hashFiles('review-issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Tracker: changes need a human check"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file review-issue.md
          else
            gh issue create --title "$TITLE" --body-file review-issue.md
          fi
