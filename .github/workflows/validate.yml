name: Validate data

on:
  pull_request:
    paths: ["tracker/**", "docs/data/**"]
  push:
    branches: [main]
    paths: ["tracker/series.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tracker/validate.py
