name: Resolve review

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition id from the review issue (e.g. iscas-2027)"
        required: true
        type: string
      action:
        description: "Apply or discard the pending change(s)"
        required: true
        type: choice
        options: [accept, reject]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply decision
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python tracker/track.py --${{ inputs.action }} "${{ inputs.edition }}"
          python tracker/build_feeds.py
          python tracker/validate.py
      - name: Commit
        run: |
          git config user.name "conference-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Review ${{ inputs.action }}: ${{ inputs.edition }}" && git push)
