name: Report a wrong date
description: A deadline, conference date or location on the site is wrong or out of date.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: edition
    attributes:
      label: Conference and year
      placeholder: "ISCAS 2027"
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What is wrong?
      options: [Paper deadline, Conference dates, Location, Website link, Other]
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
      placeholder: "Deadline extended to 27 Oct 2026"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source link
      description: Link to the conference's own page or IEEE/ACM listing that shows the correct value.
      placeholder: "https://..."
    validations:
      required: true
